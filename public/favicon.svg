<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!--
    KALKI FAVICON — Minimal K monogram
    Clean, legible at 16x16.
    Gold #C5A059 on transparent.
  -->
  <g transform="translate(16,16)">
    <!-- K monogram — geometric, sharp serifs -->
    <path
      d="M-7,-11 L-7,11 M-7,0 L7,-11 M-7,0 L7,11"
      stroke="#C5A059"
      stroke-width="2.2"
      stroke-linecap="square"
      fill="none"
    />
  </g>
</svg>
