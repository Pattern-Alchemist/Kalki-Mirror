<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!--
    KALKI — Minimal K Monogram
    Sharp geometric K. Gold #C5A059 on Akasha #0B0C10.
    Clean, modern, legible at all sizes.
  -->
  <g transform="translate(100,100)">
    <!-- Outer circle — minimal frame -->
    <circle cx="0" cy="0" r="88" stroke="#C5A059" stroke-width="0.75" fill="none"/>
    <!-- K monogram -->
    <path
      d="M-40,-56 L-40,56 M-40,0 L44,-56 M-40,0 L44,56"
      stroke="#C5A059"
      stroke-width="1.8"
      stroke-linecap="square"
      fill="none"
    />
  </g>
</svg>
