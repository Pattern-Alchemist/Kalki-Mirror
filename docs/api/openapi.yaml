openapi: '3.0.3'

info:
  title: Kalki-Mirror API
  version: 0.2.1
  description: >-
    REST API for the KALKI Tantrik Intelligence Platform.
    Pattern recognition, transit geometry, AI-powered Vedic content,
    and membership management.
  contact:
    name: KALKI Platform
    url: https://www.astrokalki.com
  license:
    name: Proprietary

servers:
  - url: https://www.astrokalki.com
    description: Production

tags:
  - name: Health
    description: Liveness and health probes
  - name: Transits
    description: Real-time planetary transit data
  - name: Initiate
    description: Session initiation with natal context
  - name: Yantra
    description: Query-grounded prompt construction
  - name: AI
    description: AI-powered Vedic content endpoints
  - name: Auth
    description: Authentication and 2FA
  - name: Keys
    description: API key generation and redemption
  - name: User
    description: User profile and tier
  - name: Admin
    description: Administrative search and notifications
  - name: Subscribe
    description: Public email capture (one list, one brain — Vol. 3 #7)
  - name: Email Course
    description: The 10 Doors course — share links and signed unsubscribe
  - name: Events
    description: First-party analytics event ingestion
  - name: Cron
    description: Scheduled jobs (Vercel cron, CRON_SECRET-gated)
  - name: Webhooks
    description: Inbound provider webhooks (signature-verified)
  - name: IndexNow
  - name: Search
    description: Search-engine ping integration
  - name: GSC
    description: Google Search Console verification

paths:
  # ── Health ────────────────────────────────────────────────
  /api:
    get:
      operationId: livenessProbe
      tags: [Health]
      summary: Liveness probe
      description: Returns a simple status check. No authentication or rate limiting.
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'

  /api/health:
    get:
      operationId: healthCheck
      tags: [Health]
      summary: Health check with subsystem status
      description: >-
        Returns detailed health information including corpus stats,
        database latency, environment, and cold-start timing.
        No authentication or rate limiting.
      responses:
        '200':
          description: Service is healthy (or degraded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Service is degraded or critical
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # ── Transits ─────────────────────────────────────────────
  /api/transits:
    get:
      operationId: getTransits
      tags: [Transits]
      summary: Current planetary transit positions
      description: >-
        Returns current planetary longitudes, nakshatra placements,
        retrograde status, and psychological friction analysis.
        Rate limited to 20 requests/min/IP.
      parameters:
        - name: natalMoonDeg
          in: query
          description: Natal Moon longitude in degrees (0-360). Coerced from string.
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 360
      responses:
        '200':
          description: Transit data with friction analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── Initiate ─────────────────────────────────────────────
  /api/initiate:
    post:
      operationId: initiateSession
      tags: [Initiate]
      summary: Initiate a session with natal or behavioral context
      description: >-
        Accepts birth data, natal moon degree, or a behavioral query
        and returns transit positions, patterns, archetypes, raga mapping,
        and siddhis. At least one of `natalMoonDeg`, `behavioralQuery`,
        or `birthDate` is required. Optional auth (falls back to prithvi tier).
        Rate limited to 5 requests/min/IP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateRequest'
      responses:
        '200':
          description: Session initiated with full analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ── Yantra ───────────────────────────────────────────────
  /api/yantra:
    post:
      operationId: buildYantra
      tags: [Yantra]
      summary: Build a grounded prompt with retrieval injection
      description: >-
        Takes a user query and optional context (patterns, transit, streaks, tier)
        and returns a retrieval-grounded system+user prompt pair. Optional auth.
        Rate limited to 5 requests/min/IP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YantraRequest'
      responses:
        '200':
          description: Grounded prompt ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YantraResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ── AI Routes ────────────────────────────────────────────
  /api/ai/ask:
    post:
      operationId: aiAsk
      tags: [AI]
      summary: Public grounded Q&A (Vol. 4 #14)
      description: >-
        Corpus-grounded question answering for the public /ask surface.
        Reuses the wizard's citation pool at the public 'prithvi' tier plus
        the deterministic pattern-bridge boost. CORPUS-OR-SILENCE contract:
        every grounded answer cites folio slugs validated against the
        retrieved set; weak retrieval or a grounding-contract breach returns
        grounded=false instead of an improvised answer. Identical
        (query · retrieved set) pairs are served from SynthesisCache. Every
        call fires an ai_ask event (Vol. 4 #17). No auth. Rate limited
        5/min/IP. Returns 503 if LLM is not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Grounded answer with validated citations, or explicit silence
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Grounded answer
                    required: [grounded, answer, citations, model, method, cached]
                    properties:
                      grounded:
                        type: boolean
                        enum: [true]
                      answer:
                        type: string
                      citations:
                        type: array
                        items:
                          type: object
                          properties:
                            slug:
                              type: string
                            section:
                              type: string
                            similarity:
                              type: number
                      model:
                        type: string
                      method:
                        type: string
                        enum: [embedding, keyword]
                      cached:
                        type: boolean
                  - type: object
                    description: Corpus-or-silence refusal
                    required: [grounded, reason]
                    properties:
                      grounded:
                        type: boolean
                        enum: [false]
                      reason:
                        type: string
                        enum: [corpus_silent, ungrounded_output]
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/search:
    post:
      operationId: aiSearch
      tags: [AI]
      summary: AI semantic search
      description: >-
        Semantic search over the corpus. No auth required.
        Rate limited to 5/min/IP. Returns 503 if LLM is not configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 3
                  maxLength: 500
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/japa-guide:
    post:
      operationId: aiJapaGuide
      tags: [AI]
      summary: AI japa (mantra repetition) guide
      description: >-
        Generates a personalized japa guide for a given mantra.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mantra]
              properties:
                mantra:
                  type: string
                  minLength: 2
                count:
                  type: integer
                  minimum: 1
                  default: 108
                experience:
                  type: string
                  maxLength: 1000
      responses:
        '200':
          description: Japa guide generated
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/consultation-screen:
    post:
      operationId: aiConsultationScreen
      tags: [AI]
      summary: AI consultation screening
      description: >-
        Screens a user's consultation message before routing.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, message]
              properties:
                name:
                  type: string
                  minLength: 2
                  maxLength: 200
                message:
                  type: string
                  minLength: 10
                  maxLength: 5000
      responses:
        '200':
          description: Screening result
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/archetype-quiz:
    post:
      operationId: aiArchetypeQuiz
      tags: [AI]
      summary: AI archetype quiz analysis
      description: >-
        Analyzes archetype quiz answers to determine dominant patterns.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: string
                    minLength: 5
                  minItems: 5
                  maxItems: 10
      responses:
        '200':
          description: Archetype analysis result
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/explain:
    post:
      operationId: aiExplain
      tags: [AI]
      summary: AI content explanation
      description: >-
        Explains Vedic/tantrik content in beginner or technical style.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 20
                  maxLength: 10000
                style:
                  type: string
                  enum: [beginner, technical]
                  default: beginner
      responses:
        '200':
          description: Explanation generated
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/breathwork:
    post:
      operationId: aiBreathwork
      tags: [AI]
      summary: AI breathwork session generator
      description: >-
        Generates a guided breathwork session of the specified type and duration.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum:
                    - calming
                    - energizing
                    - focus
                    - nadi-shuddhi
                    - bhramari
                    - custom
                duration:
                  type: integer
                  minimum: 3
                  maximum: 60
                  default: 15
                  description: Session duration in minutes
      responses:
        '200':
          description: Breathwork session generated
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/pattern-explain:
    post:
      operationId: aiPatternExplain
      tags: [AI]
      summary: AI pattern explanation
      description: >-
        Explains a specific pattern by its slug with optional context.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patternSlug]
              properties:
                patternSlug:
                  type: string
                  minLength: 1
                context:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Pattern explanation generated
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/recommend-tier:
    post:
      operationId: aiRecommendTier
      tags: [AI]
      summary: AI tier recommendation
      description: >-
        Recommends a membership tier based on quiz answers.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: string
                    minLength: 5
                  minItems: 3
                  maxItems: 5
      responses:
        '200':
          description: Tier recommendation
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/transit-interpretation:
    post:
      operationId: aiTransitInterpretation
      tags: [AI]
      summary: AI transit interpretation
      description: >-
        Generates an interpretation for given planetary positions.
        No auth. Rate limited 5/min/IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [positions]
              properties:
                positions:
                  type: array
                  items:
                    $ref: '#/components/schemas/TransitPositionInput'
                  minItems: 1
      responses:
        '200':
          description: Transit interpretation generated
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/ai/draft:
    post:
      operationId: aiDraft
      tags: [AI]
      summary: AI content draft generation
      description: >-
        Generates a content draft for practice, archetype, pattern, research, or codex.
        **Requires authentication.** Rate limited 5/min/IP.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftRequest'
      responses:
        '200':
          description: Draft generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ── User ─────────────────────────────────────────────────
  /api/user/tier:
    get:
      operationId: getUserTier
      tags: [User]
      summary: Get current user tier
      description: Returns the authenticated user's tier and remaining gold keys.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User tier info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserTierResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Keys ─────────────────────────────────────────────────
  /api/keys:
    get:
      operationId: getKeys
      tags: [Keys]
      summary: List keys for a vault
      description: >-
        Lists keys for the authenticated user's vault, or another vault
        if the user is ADMIN/SUPERADMIN. The `vault` query param is an optional
        userId — only the owner or admin roles may access.
      security:
        - bearerAuth: []
      parameters:
        - name: vault
          in: query
          description: Optional userId to inspect (owner-only unless ADMIN/SUPERADMIN)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Key listing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeysListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createKey
      tags: [Keys]
      summary: Generate a new invite key
      description: >-
        Generates a new key (format `KALKI-XXXX-XXXX`).
        Requires Jal tier or above and `goldKeysRemaining > 0`.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tierGranted:
                  type: string
                  enum: [prithvi, jal, agni, akash]
                  default: jal
                  description: Tier granted by the generated key
      responses:
        '200':
          description: Key generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateKeyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/keys/redeem:
    post:
      operationId: redeemKey
      tags: [Keys]
      summary: Redeem an invite key
      description: >-
        Redeems a key code to grant the user the associated tier.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 30
      responses:
        '200':
          description: Key redeemed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'

  # ── Auth ─────────────────────────────────────────────────
  /api/auth/2fa-verify:
    post:
      operationId: verify2FA
      tags: [Auth]
      summary: Verify 2FA code
      description: >-
        Verifies a 6-digit 2FA code using a pre-auth token.
        On success, sets a `next-auth.session-token` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFARequest'
      responses:
        '200':
          description: 2FA verified
          headers:
            Set-Cookie:
              description: Sets next-auth.session-token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFAResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/session-validate:
    get:
      operationId: validateSession
      tags: [Auth]
      summary: Validate JWT session
      description: >-
        Validates a JWT session using custom headers. The token must
        contain both `id` and `jti` claims.
      security: []
      parameters:
        - name: X-Kalki-JTI
          in: header
          required: true
          schema:
            type: string
          description: JWT ID claim
        - name: X-Kalki-User-Id
          in: header
          required: true
          schema:
            type: string
          description: User ID claim
        - name: X-Kalki-User-Agent
          in: header
          required: true
          schema:
            type: string
          description: Client user agent
        - name: X-Kalki-IP
          in: header
          required: true
          schema:
            type: string
          description: Client IP address
      responses:
        '200':
          description: Session is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionValidateResponse'
        '401':
          description: Session invalid or evicted
          headers:
            X-Session-Invalid:
              description: Present with value 'evicted' when session was evicted
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInvalidResponse'

  # ── Admin ────────────────────────────────────────────────
  /api/admin/search:
    get:
      operationId: adminSearch
      tags: [Admin]
      summary: Admin global search
      description: >-
        Searches across members, keys, and consultations.
        Requires ADMIN, SUPERADMIN, EDITOR, or REVIEWER role.
        Rate limited to 20 requests/min/user.
      security:
        - adminAuth: []
      parameters:
        - name: q
          in: query
          description: >-
            Search query. Must be at least 2 characters after trimming;
            returns empty results otherwise.
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSearchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/admin/notifications:
    get:
      operationId: getAdminNotifications
      tags: [Admin]
      summary: List admin notifications
      description: >-
        Returns notifications for the admin dashboard.
        Requires ADMIN, SUPERADMIN, EDITOR, or REVIEWER role.
      security:
        - adminAuth: []
      parameters:
        - name: since
          in: query
          description: ISO 8601 date string to filter notifications after this time
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Notifications listed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'

    post:
      operationId: createAdminNotification
      tags: [Admin]
      summary: Create an admin notification
      description: >-
        Creates a new notification. Set `broadcast: true` to notify all users.
        Requires ADMIN, SUPERADMIN, EDITOR, or REVIEWER role.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNotificationRequest'
      responses:
        '201':
          description: Notification created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateNotificationResponse'

    patch:
      operationId: patchAdminNotification
      tags: [Admin]
      summary: Mark notification(s) as read
      description: >-
        Marks a single notification or all notifications as read.
        Requires ADMIN, SUPERADMIN, EDITOR, or REVIEWER role.
      security:
        - adminAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNotificationRequest'
      responses:
        '200':
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

# ── Components ──────────────────────────────────────────────
  # ── Auto-documented fills (scripts/gen-openapi-paths.mjs — Vol. 3 #20) ──
  # Minimal truthful entries for routes the hand-written section never
  # covered. Summaries are quoted from each route module header. Enrich
