components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        NextAuth JWT via Bearer token (cookie-based).
        Used for standard authenticated routes.
    adminAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        NextAuth JWT with ADMIN, SUPERADMIN, EDITOR, or REVIEWER role required.

  # ── Reusable Responses ──────────────────────────────────
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized — missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Forbidden — insufficient role or tier
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Conflict — resource already exists or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Gone:
      description: Gone — resource has expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: LLM not configured or returned invalid JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ── Schemas ─────────────────────────────────────────────
  schemas:

    # Shared
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # Health
    LivenessResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp

    HealthStatus:
      type: string
      enum: [ok, degraded, critical]

    HealthCorpus:
      type: object
      required: [total, withEmbeddings, cautionBreakdown, source]
      properties:
        total:
          type: integer
        withEmbeddings:
          type: integer
        cautionBreakdown:
          type: object
          additionalProperties:
            type: integer
          description: Map of caution level to count
        source:
          type: string

    HealthDatabase:
      type: object
      required: [status, latencyMs]
      properties:
        status:
          type: string
          enum: [ok, error]
        latencyMs:
          type: integer
        error:
          type: string
          nullable: true

    HealthTiming:
      type: object
      required: [coldStartMs, isServerless]
      properties:
        coldStartMs:
          type: integer
        isServerless:
          type: boolean

    HealthResponse:
      type: object
      required: [status, corpus, database, environment, timing, timestamp]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        corpus:
          $ref: '#/components/schemas/HealthCorpus'
        database:
          $ref: '#/components/schemas/HealthDatabase'
        environment:
          type: string
          enum: [local, serverless]
        timing:
          $ref: '#/components/schemas/HealthTiming'
        timestamp:
          type: string

    # Transits
    TransitPlanet:
      type: object
      required: [planet, sanskrit, longitude, nakshatra, nakshatraPada, retrograde]
      properties:
        planet:
          type: string
        sanskrit:
          type: string
        longitude:
          type: number
        nakshatra:
          type: string
        nakshatraPada:
          type: integer
        retrograde:
          type: boolean

    FrictionSeverity:
      type: string
      enum: [critical, moderate, subtle]

    TransitFriction:
      type: object
      required: [type, planet1, planet2, orb, severity, psychologicalFriction, prescribedMicroSadhana]
      properties:
        type:
          type: string
        planet1:
          type: string
        planet2:
          type: string
        orb:
          type: number
        severity:
          $ref: '#/components/schemas/FrictionSeverity'
        psychologicalFriction:
          type: string
        prescribedMicroSadhana:
          type: string

    TransitResponse:
      type: object
      required: [timestamp, positions, frictions, yantra_context]
      properties:
        timestamp:
          type: string
        positions:
          type: array
          items:
            $ref: '#/components/schemas/TransitPlanet'
        frictions:
          type: array
          items:
            $ref: '#/components/schemas/TransitFriction'
        yantra_context:
          type: string

    # Initiate
    InitiateRequest:
      type: object
      properties:
        birthDate:
          type: string
          description: Date of birth (YYYY-MM-DD or similar)
        birthTime:
          type: string
          description: Time of birth
        birthPlace:
          type: string
          maxLength: 200
        natalMoonDeg:
          type: number
          minimum: 0
          maximum: 360
          description: Natal Moon longitude in degrees
        behavioralQuery:
          type: string
          maxLength: 2000
      description: >-
        At least one of `natalMoonDeg`, `behavioralQuery`, or `birthDate` is required.

    InitiateResponse:
      type: object
      required: [transit, patterns, archetypes, rag, siddhis]
      properties:
        transit:
          type: object
        patterns:
          type: array
          maxItems: 3
          items:
            type: object
        archetypes:
          type: array
          items:
            type: object
        rag:
          type: object
        siddhis:
          type: array
          items:
            type: object

    # Yantra
    SadhanaStreak:
      type: object
      required: [practice, days]
      properties:
        practice:
          type: string
        days:
          type: integer

    YantraContext:
      type: object
      properties:
        dominantPatterns:
          type: array
          items:
            type: string
        currentTransit:
          type: string
        sadhanaStreaks:
          type: array
          items:
            $ref: '#/components/schemas/SadhanaStreak'
        tier:
          type: string

    YantraRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          minLength: 10
          maxLength: 2000
        context:
          $ref: '#/components/schemas/YantraContext'

    YantraResponse:
      type: object
      required:
        - status
        - retrieval_method
        - folio_blocks_injected
        - archive_refs
        - system_prompt_length
        - user_prompt_length
        - user_prompt
      properties:
        status:
          type: string
          example: grounded_prompt_ready
        retrieval_method:
          type: string
        folio_blocks_injected:
          type: integer
        archive_refs:
          type: array
          items:
            type: string
        system_prompt_length:
          type: integer
        user_prompt_length:
          type: integer
        user_prompt:
          type: string

    # AI shared
    TransitPositionInput:
      type: object
      required: [planet, sign, degree]
      properties:
        planet:
          type: string
          minLength: 1
        sign:
          type: string
          minLength: 1
        degree:
          type: number
          minimum: 0
          maximum: 360

    DraftType:
      type: string
      enum: [practice, archetype, pattern, research, codex]

    CautionLevel:
      type: string
      enum: [OPEN, MODERATE, HIGH, SEALED]

    Tier:
      type: string
      enum: [prithvi, jal, agni, akash]

    DraftRequest:
      type: object
      required: [type, title]
      properties:
        type:
          $ref: '#/components/schemas/DraftType'
        title:
          type: string
          minLength: 3
          maxLength: 300
        context:
          type: string
          maxLength: 2000

    DraftResponse:
      type: object
      required: [draft, suggestedCaution, suggestedTier, relatedSiddhis]
      properties:
        draft:
          type: string
        suggestedCaution:
          $ref: '#/components/schemas/CautionLevel'
        suggestedTier:
          $ref: '#/components/schemas/Tier'
        relatedSiddhis:
          type: array
          maxItems: 5
          items:
            type: string

    # User
    UserTierResponse:
      type: object
      required: [tier, goldKeysRemaining]
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        goldKeysRemaining:
          type: integer

    # Keys
    KeysListResponse:
      type: object
      required: [tier, remainingKeys, vault]
      properties:
        tier:
          type: string
        remainingKeys:
          type: integer
        vault:
          type: array
          items:
            type: object

    CreateKeyResponse:
      type: object
      required: [key, tierGranted, expiresAt, remainingKeys]
      properties:
        key:
          type: string
          pattern: '^KALKI-[A-Z0-9]{4}-[A-Z0-9]{4}$'
          example: KALKI-A7F2-B9C1
        tierGranted:
          type: string
        expiresAt:
          type: string
          format: date-time
        remainingKeys:
          type: integer

    RedeemKeyResponse:
      type: object
      required: [status, tierGranted, message]
      properties:
        status:
          type: string
          example: key_redeemed
        tierGranted:
          type: string
        message:
          type: string

    # Auth
    TwoFARequest:
      type: object
      required: [userId, code, preAuthToken]
      properties:
        userId:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: Exactly 6-character 2FA code
        preAuthToken:
          type: string

    TwoFAResponse:
      type: object
      required: [valid, required]
      properties:
        valid:
          type: boolean
          example: true
        required:
          type: boolean

    SessionValidateResponse:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
          example: true

    SessionInvalidReason:
      type: string
      enum: [no_token, session_evicted]

    SessionInvalidResponse:
      type: object
      required: [valid, reason]
      properties:
        valid:
          type: boolean
          example: false
        reason:
          $ref: '#/components/schemas/SessionInvalidReason'

    # Admin
    AdminSearchResultType:
      type: string
      enum: [member, key, consultation]

    AdminSearchResultItem:
      type: object
      required: [type, id, title, subtitle, href]
      properties:
        type:
          $ref: '#/components/schemas/AdminSearchResultType'
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        href:
          type: string

    AdminSearchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AdminSearchResultItem'

    NotificationType:
      type: string
      default: info

    CreateNotificationRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
        body:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
        href:
          type: string
        broadcast:
          type: boolean
          default: false

    CreateNotificationResponse:
      type: object
      required: [notification]
      properties:
