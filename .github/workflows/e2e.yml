name: e2e

# Vol. 3 #16 — wire the orphaned E2E suite into CI.
# Public flows (wizard→submit, subscribe→unsubscribe) + the admin walls run
# against a PRODUCTION build with a throwaway SQLite and scrubbed secrets —
# the same contract as scripts/run-e2e.sh.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'scripts/run-e2e.sh'
      - 'prisma/schema.prisma'
      - 'package.json'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_EMAIL: archivist@kalki.test
      ADMIN_PASSWORD: e2e-admin-password-not-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run E2E suite (dev contract via run-e2e.sh, CI server via config)
        run: bash scripts/run-e2e.sh

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
